services:
  sealbase:
    image: ghcr.io/clementgre/sealbase-server:${TAG:-latest}
    container_name: sealbase
    restart: unless-stopped
    labels:
      traefik.enable: true
      traefik.http.routers.sealbase.rule: Host(`${API_DOMAIN}`)
      traefik.http.services.sealbase.loadbalancer.server.port: 80
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${DB_USER:?set DB_USER}:${DB_PASSWORD:?set DB_PASSWORD}@postgres:5432/${DB_NAME:?set DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: "${CORS}"
      CLIENT_IP_HEADER: X-Forwarded-For
    networks:
      - traefik
      - postgres

networks:
  traefik:
    external: true
  postgres:
    external: true
