services:
  postgres:
    image: postgres:18-alpine
    container_name: sealbase-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sealbase
      POSTGRES_USER: sealbase
      POSTGRES_PASSWORD: sealbase
    restart: always
    volumes:
      - ./data/postgres:/var/lib/postgresql

  sealbase:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: sealbase
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgres://sealbase:sealbase@postgres:5432/sealbase?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ALLOWED_ORIGINS: '*'
      CLIENT_IP_HEADER: ''
    restart: always
    depends_on:
      - postgres

  example:
    build:
      # Repo root: the example builds the client lib from ./client.
      context: .
      dockerfile: example/vue/Dockerfile
    container_name: sealbase-example
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "80:80"
    restart: always
